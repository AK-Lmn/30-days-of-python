[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-dashboard"
version = "0.1.0"
description = "System information dashboard rendered in the terminal."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Developer" }
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
termdash = "terminal_dashboard.cli:main"
terminal-dashboard = "terminal_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terminal_dashboard*"]
