[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuspg"
version = "0.1.0"
description = "Enterprise Relational Feature Flag and Configuration Management REST API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nexuspg = "nexuspg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexuspg*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

