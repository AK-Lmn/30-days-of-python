[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wardenauth"
version = "0.1.0"
description = "Production-grade Authentication & Identity Management REST API with JWT, Sessions, RBAC, and Audit Logging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
wardenauth = "wardenauth.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wardenauth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
