[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "0.1.0"
description = "Automatically sort messy directories by file type, extension, naming rules, and custom categories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Developer" }
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
organizer = "organizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["organizer*"]
