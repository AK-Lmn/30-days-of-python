[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-aggregator"
version = "0.1.0"
description = "Multi-source API aggregator with unified responses, resilient fetching, circuit breaking, and caching."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Developer" }
]
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
api-aggregator = "api_aggregator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_aggregator*"]
