[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeforge"
version = "0.1.0"
description = "Production-grade, extensible ETL pipeline with schema validation, data quality gates, and multi-source loaders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "click>=8.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.1",
]

[project.scripts]
pipeforge = "pipeforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
