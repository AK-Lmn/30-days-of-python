[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "price-tracker"
version = "0.1.0"
description = "Track product prices over time, store historical data, and detect meaningful price changes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Developer" }
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "customtkinter>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
price-tracker = "price_tracker.cli:main"
price-tracker-gui = "price_tracker.gui:run_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["price_tracker*"]
