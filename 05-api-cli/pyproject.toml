[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-cli"
version = "0.1.0"
description = "Universal API CLI for sending REST requests, filtering responses, formatting output, and exporting API data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Developer" }
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "jmespath>=1.0.1",
    "customtkinter>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
api = "api_cli.cli:main"
api-cli = "api_cli.cli:main"
api-gui = "api_cli.gui:run_gui"
api-cli-gui = "api_cli.gui:run_gui"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_cli*"]
